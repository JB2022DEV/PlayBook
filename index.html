<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>PlayBook</title>
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
/* Layout: 2-col grid of frosted-glass poster cards floating over a dark,
   softly-lit ambient field (blurred colour blobs behind everything). Dark is
   the app's stock look; light swaps the same glass language onto a bright
   field. A biometric lock screen and a branded splash gate entry; the
   dashboard itself opens a glass bottom sheet for filters, detail and the
   add/edit form, each with spring-driven drag-to-dismiss. */
:root{
  --bg:#ffffff;
  --bg-translucent:rgba(255,255,255,0.72);
  --surface:rgba(255,255,255,0.55);
  --surface-2:rgba(255,255,255,0.68);
  --glass-border:rgba(255,255,255,0.75);
  --glass-sheen:inset 0 1px 0 rgba(255,255,255,0.9);
  --border:rgba(60,60,67,0.14);
  --fg:#1c1c1e;
  --fg-muted:#6e6e73;
  --fg-faint:#9c99a8;
  --accent:#5e5ce6;
  --notify:#ff3b30;
  --shadow:rgba(40,35,70,0.14);
  --scrim:rgba(20,16,30,0.32);
  color-scheme: light;

  --st-slobodna:#1fa352;
  --st-prijateljica:#0a84ff;
  --st-fwb:#af52de;
  --st-ons:#e0197a;
  --st-dejtam:#ff9500;
  --st-girlfriend:#ff3b30;
  --st-gotovo:#8e8e93;
}
:root[data-theme="dark"]{
  --bg:#000000;
  --bg-translucent:rgba(0,0,0,0.70);
  --surface:rgba(255,255,255,0.08);
  --surface-2:rgba(32,30,42,0.62);
  --glass-border:rgba(255,255,255,0.14);
  --glass-sheen:inset 0 1px 0 rgba(255,255,255,0.16);
  --border:rgba(255,255,255,0.12);
  --fg:#f5f5f7;
  --fg-muted:#aaa8b8;
  --fg-faint:#78758a;
  --accent:#8b89ff;
  --notify:#ff6961;
  --shadow:rgba(0,0,0,0.55);
  --scrim:rgba(0,0,0,0.5);
  color-scheme: dark;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden]{ display:none !important; }
html,body{ height:100%; }
body{
  margin:0;
  background-color: var(--bg);
  color: var(--fg);
  font: 400 15px/1.4 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}

/* glass material: translucent fill + blur + a light-catching top edge */
.card, .sheet, .search-box, .filter-btn, .theme-toggle, .field-box, .note-block,
.chip, .photo-picker, .form-field input, .form-field textarea, .form-field select,
#locationSelect, .pin-input{
  backdrop-filter: blur(22px) saturate(1.7);
  -webkit-backdrop-filter: blur(22px) saturate(1.7);
  border: 1px solid var(--glass-border);
}
.search-box, .filter-btn, .theme-toggle, .field-box, .note-block, .chip, .photo-picker{
  box-shadow: var(--glass-sheen);
}
h1,h2,h3{ text-wrap: balance; margin:0; }
button{ font-family: inherit; }

#appRoot{
  display:none;
  transform-origin: center 20%;
  transition: transform .4s cubic-bezier(.22,1,.36,1), filter .4s ease;
}
#appRoot.receded{ transform: scale(0.96); filter: brightness(0.82); }

/* instant press feedback everywhere pressable */
.pressable{ transition: transform .12s ease-out; }
.pressable:active{ transform: scale(0.95); }

/* ---------- lock screen: wordmark pinned near the top, the unlock control
   pinned low where a thumb naturally rests when holding the phone ---------- */
#lockScreen{
  position: fixed; inset:0; z-index: 200;
  display:flex; flex-direction:column; align-items:center;
  padding: max(40px, calc(env(safe-area-inset-top,0px) + 32px)) max(24px, env(safe-area-inset-right,0px)) max(64px, calc(env(safe-area-inset-bottom,0px) + 56px)) max(24px, env(safe-area-inset-left,0px));
  text-align:center;
  background-color: var(--bg);
}
.lock-wordmark{
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--fg);
}
.lock-bottom{
  margin-top: auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap: 18px;
}
.lock-sub{ font-size:14px; color:var(--fg-muted); max-width:260px; line-height:1.5; font-weight:500; }
.fp-btn{
  width:64px; height:64px; border-radius:50%;
  background: none;
  border: none !important;
  box-shadow: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  display:flex; align-items:center; justify-content:center;
  color: var(--fg);
  cursor:pointer;
}
.fp-icon-mask{
  width: 46px; height: 55px;
  background-color: currentColor;
  -webkit-mask-image: url('icons/fingerprint-mask.png');
  mask-image: url('icons/fingerprint-mask.png');
  -webkit-mask-size: contain;
  mask-size: contain;
  -webkit-mask-repeat: no-repeat;
  mask-repeat: no-repeat;
  -webkit-mask-position: center;
  mask-position: center;
}
.fp-btn.pulse{ animation: fpPulse 2.4s ease-in-out infinite; }
@keyframes fpPulse{
  0%,100%{ opacity: 1; transform: scale(1); }
  50%{ opacity: .55; transform: scale(0.96); }
}
.lock-error{ color: var(--st-girlfriend); font-size:13px; font-weight:650; min-height:18px; }
.pin-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.pin-input{
  width:170px; text-align:center; letter-spacing:12px; font-size:22px; font-weight:700;
  padding:13px 10px 13px 22px; border-radius:14px;
  background: var(--surface); color: var(--fg); outline:none;
}

/* ---------- splash screen ---------- */
#splashScreen{
  position: fixed; inset:0; z-index: 150;
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  background-color: var(--bg);
  opacity:0;
  transition: opacity .5s ease;
}
#splashScreen.show{ display:flex; opacity:1; }
#splashScreen.out{ opacity:0; }
.splash-word{
  font-size: clamp(32px, 11vw, 48px);
  font-weight: 800;
  letter-spacing: 0.1em;
  line-height: 1.16;
  color: var(--fg);
  opacity:0;
  transform: translateY(14px) scale(0.94);
  filter: blur(8px);
}
#splashScreen.show .splash-word{ animation: splashIn 1.3s cubic-bezier(.19,.86,.24,1) forwards; }
#splashScreen.show .splash-word:nth-child(1){ animation-delay: .15s; }
#splashScreen.show .splash-word:nth-child(2){ animation-delay: .55s; }
#splashScreen.show .splash-word:nth-child(3){ animation-delay: .95s; }
.splash-word.danger{ color: var(--st-girlfriend); }
@keyframes splashIn{
  60%{ filter:blur(0); }
  to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); letter-spacing:-0.015em; }
}

/* ---------- top bar ---------- */
.topbar{
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  padding-top: calc(env(safe-area-inset-top, 0px) + 22px);
  padding-bottom: 16px;
  margin: 0 -16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg-translucent);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
}
.topbar-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap: 10px;
}
.topbar h1{
  font-size: clamp(28px, 7.5vw, 34px);
  font-weight: 800;
  letter-spacing: -0.022em;
  line-height: 1.05;
}
.topbar .sub{
  margin-top: 4px;
  font-size: 13px;
  letter-spacing: 0;
  color: var(--fg-muted);
}
.theme-toggle{
  flex: 0 0 auto;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg-muted);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  margin-top: 2px;
}
.search-row{
  display:flex;
  gap: 8px;
  margin-top: 18px;
}
.add-btn{
  flex: 0 0 auto;
  display:flex; align-items:center; gap:6px;
  background: var(--accent);
  color:#fff;
  border:none;
  border-radius: 12px;
  padding: 0 14px;
  font-size: 13.5px;
  font-weight: 700;
  cursor:pointer;
}
.search-box{
  flex: 1 1 auto;
  display:flex;
  align-items:center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 12px;
  min-width: 0;
}
.search-box svg{ flex: 0 0 auto; color: var(--fg-faint); }
.search-box input{
  border:none; outline:none; background:transparent; color: var(--fg);
  font-size: 15px; width:100%; min-width:0;
}
.search-box input::placeholder{ color: var(--fg-faint); }
.filter-btn{
  position: relative;
  flex: 0 0 auto;
  width: 42px; height: 42px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--fg);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.filter-btn.active{ background: var(--accent); border-color: transparent; color:#fff; }
.filter-dot{
  position:absolute; top:-3px; right:-3px;
  width:10px; height:10px; border-radius:50%;
  background: var(--notify);
  border: 2px solid var(--bg);
}

/* ---------- grid ---------- */
.grid{
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 26px 18px;
  padding: 16px 0 140px;
}
.card{
  background: var(--surface);
  border-radius: 22px;
  overflow:hidden;
  box-shadow: 0 10px 28px -10px var(--shadow), var(--glass-sheen);
  cursor:pointer;
  min-width: 0;
}
.card.ended .photo, .card.ended .meta{ filter: grayscale(0.85); opacity: 0.5; }
.photo{
  position:relative;
  aspect-ratio: 1 / 1;
  display:flex; align-items:center; justify-content:center;
  font-weight:700; font-size: 15px; color:#fff;
}
.rating-pill{
  position:absolute; top:8px; right:8px;
  background: rgba(0,0,0,0.38);
  color:#fff;
  font-size: 11px; font-weight:700;
  padding: 3px 7px;
  border-radius: 999px;
  backdrop-filter: blur(6px);
  font-variant-numeric: tabular-nums;
  display:flex; align-items:center; gap:3px;
}
.status-tag{
  position:absolute; left:8px; bottom:8px; right:8px;
  font-size: 10.5px; font-weight:700;
  color:#fff;
  padding: 4px 8px;
  border-radius: 8px;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(6px);
  white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
}
.status-tag .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  margin-right:5px; vertical-align:middle;
}
.meta{ padding: 12px 13px 14px; }
.meta .name-line{ display:flex; align-items:baseline; gap:5px; min-width:0; }
.meta .name{
  font-weight: 650;
  font-size: 14.5px;
  letter-spacing: -0.005em;
  white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
  flex: 1 1 auto; min-width: 0;
}
.meta .age{ font-size: 13px; color: var(--fg-muted); flex:0 0 auto; }
.meta .loc{
  margin-top: 4px;
  font-size: 12px; color: var(--fg-faint);
  white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
}
.empty-state{
  grid-column: 1 / -1;
  text-align:center;
  padding: 60px 20px;
  color: var(--fg-faint);
  font-size: 14px;
  line-height: 1.6;
}

/* ---------- sheets (shared) ---------- */
.sheet-backdrop{
  position: fixed; inset:0;
  background: var(--scrim);
  z-index: 40;
  opacity: 0;
  pointer-events:none;
}
.sheet-backdrop.show{ pointer-events:auto; }
.sheet{
  position: fixed; left:0; right:0; bottom:0;
  max-height: 90vh;
  overflow-y:auto;
  background: var(--surface-2);
  border-radius: 28px 28px 0 0;
  border-bottom: none;
  padding: 10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  box-shadow: 0 -16px 40px -16px var(--shadow), var(--glass-sheen);
  z-index: 41;
  will-change: transform;
  -webkit-overflow-scrolling: touch;
}
.sheet-handle{
  width:36px; height:5px; border-radius:3px;
  background: var(--fg-faint);
  opacity:.5;
  margin: 6px auto 10px;
  cursor: grab;
}
.sheet h2{ font-size: 20px; font-weight: 800; letter-spacing: -0.01em; margin-bottom: 18px; }
.section-label{
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform:uppercase;
  color: var(--fg-faint); margin: 22px 0 10px;
}
.chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{
  padding: 8px 13px;
  border-radius: 999px;
  font-size: 13px; font-weight:600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--fg-muted);
  cursor:pointer; user-select:none;
}
.chip.on{ background: var(--fg); color: var(--bg); border-color: transparent; }
.chip .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; }

.range-row{ display:flex; align-items:center; gap:10px; }
.range-row input[type=range]{ flex:1 1 auto; accent-color: var(--accent); }
.range-val{ font-size:13px; font-weight:700; color: var(--fg); min-width: 34px; text-align:right; font-variant-numeric: tabular-nums; }
.two-col{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-box{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 11px;
}
.field-box label{ display:block; font-size:10.5px; color:var(--fg-faint); font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }
.field-box input, .field-box select{
  width:100%; border:none; background:transparent; color:var(--fg); font-size:14px; outline:none; font-family:inherit;
}
.row-switch{
  display:flex; align-items:center; justify-content:space-between;
  margin-top: 16px;
  font-size: 14px; font-weight: 600;
}
.switch{ position:relative; width:46px; height:28px; border-radius:14px; background: var(--border); cursor:pointer; flex:0 0 auto; }
.switch.on{ background: var(--accent); }
.switch .knob{ position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition: transform .2s ease; }
.switch.on .knob{ transform: translateX(18px); }

.sheet-actions{ display:flex; align-items:center; gap:10px; margin-top:26px; }
.btn{
  flex:1 1 auto; border:none; border-radius:13px; padding: 12px 0;
  font-size: 15px; font-weight: 650; cursor:pointer;
}
.btn-ghost{ background: var(--surface); border:1px solid var(--border); color: var(--fg); }
.btn-primary{ background: var(--accent); color:#fff; }
.btn-danger{ background: rgba(255,69,58,0.14); color: var(--st-girlfriend); }
.btn-ok{ background: rgba(48,184,92,0.14); color: var(--st-slobodna); }
.btn-small{
  flex: 0 0 auto;
  background: transparent;
  border: none;
  padding: 8px 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--st-girlfriend);
}
.btn-small.ok{ color: var(--st-slobodna); }

/* detail sheet */
.detail-head{ display:flex; gap:14px; align-items:center; }
.detail-avatar{
  width:64px; height:64px; border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:19px; flex:0 0 auto;
}
.detail-head .nm{ font-size:19px; font-weight:800; letter-spacing:-0.01em; }
.detail-head .sub{ font-size:13px; color:var(--fg-muted); margin-top:2px; }
.detail-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:20px; }
.note-block{ background: var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 14px; margin-top:12px; }
.note-block .label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-faint); margin-bottom:4px; }
.note-block p{ margin:0; font-size:14px; line-height:1.5; }
.created-line{
  text-align:center;
  font-size: 11px;
  color: var(--fg-faint);
  margin-top: 16px;
}

/* photo picker */
.photo-picker-row{ display:flex; align-items:center; gap:16px; margin: 14px 0 6px; }
.photo-picker{
  width:92px; height:92px; border-radius:24px; flex:0 0 auto;
  background: var(--surface);
  border: 1.5px dashed var(--border);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; cursor:pointer; position:relative;
}
.photo-picker img{ width:100%; height:100%; object-fit:cover; display:none; }
.photo-picker-empty{ display:flex; flex-direction:column; align-items:center; gap:5px; color:var(--fg-faint); font-size:10.5px; font-weight:700; text-align:center; padding: 0 6px; }
.photo-picker-actions{ display:flex; flex-direction:column; gap:9px; }

/* crop sheet */
.crop-frame{
  width: 100%;
  max-width: 320px;
  aspect-ratio: 1 / 1;
  margin: 6px auto 0;
  border-radius: 24px;
  overflow: hidden;
  position: relative;
  background: #000;
  touch-action: none;
  cursor: grab;
}
.crop-frame:active{ cursor: grabbing; }
.crop-image{
  position: absolute;
  top: 0; left: 0;
  background-repeat: no-repeat;
  pointer-events: none;
}
.crop-hint{
  text-align:center;
  font-size: 12px;
  color: var(--fg-faint);
  margin-top: 10px;
}
.crop-zoom-row{ display:flex; align-items:center; gap:12px; margin-top:16px; color: var(--fg-faint); }
.crop-zoom-row input[type=range]{ flex:1 1 auto; accent-color: var(--accent); }
.link-btn{ background:none; border:none; padding:0; font-size:13.5px; font-weight:650; color: var(--accent); cursor:pointer; text-align:left; }
.link-btn.danger{ color: var(--st-girlfriend); }

/* form inputs in add/edit sheet */
.form-field{ margin-bottom: 2px; }
.form-field label{ display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-faint); margin:14px 0 6px; }
.form-field input, .form-field textarea, .form-field select{
  width:100%; background: var(--surface); border:1px solid var(--border); border-radius:12px;
  padding: 10px 12px; font-size:15px; color:var(--fg); font-family:inherit; outline:none;
}
.form-field textarea{ resize:vertical; min-height:56px; }

.delete-zone{ margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--border); text-align:center; }
.delete-confirm{ margin-top: 12px; }
.delete-confirm p{ margin:0; font-size:13px; color: var(--fg-muted); line-height:1.5; }
.btn-danger-solid{ background: var(--st-girlfriend); color:#fff; }

@media (prefers-reduced-motion: reduce){
  #appRoot, .sheet, .switch .knob, .pressable{ transition: opacity .15s ease !important; transform:none !important; }
  .fp-btn.pulse{ animation: none !important; }
  .splash-word{ animation: none !important; opacity:1 !important; transform:none !important; }
}
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-wordmark">PlayBook</div>
  <div class="lock-bottom">
    <div class="lock-sub" id="lockSub">Učitavanje…</div>
    <button class="fp-btn pulse pressable" id="fpBtn" aria-label="Otključaj otiskom prsta" hidden>
      <span class="fp-icon-mask"></span>
    </button>
    <div class="pin-wrap" id="pinWrap" hidden>
      <input class="pin-input" id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••">
      <button class="btn btn-primary" id="pinSubmit" style="width:170px;">Potvrdi</button>
    </div>
    <div class="lock-error" id="lockError"></div>
  </div>
</div>

<div id="splashScreen">
  <div class="splash-word">VOLUME</div>
  <div class="splash-word danger">NEGATES</div>
  <div class="splash-word">LUCK</div>
</div>

<div id="appRoot">
  <div class="topbar">
    <div class="topbar-head">
      <div>
        <h1>PlayBook</h1>
        <p class="sub" id="countLine"></p>
      </div>
      <button class="theme-toggle pressable" id="themeToggle" aria-label="Promijeni temu"></button>
    </div>
    <div class="search-row">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" placeholder="Pretraži po imenu">
      </div>
      <button class="filter-btn pressable" id="filterOpenBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M8 12h8M11 18h2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <span class="filter-dot" id="filterDot" hidden></span>
      </button>
      <button class="add-btn pressable" id="addOpenBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        Dodaj
      </button>

<script>
/* ================= local storage (IndexedDB) — everything stays on-device ================= */
const DB_NAME = "playbook_db", DB_VERSION = 1, STORE = "profiles";
function dbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(STORE, { keyPath:"id" }); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbGetAll(){
  const db = await dbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}
async function dbPut(profile){
  const db = await dbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(profile);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function dbDelete(id){
  const db = await dbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

/* ================= service worker (offline) ================= */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}

/* ================= tiny spring engine (critically damped by default) ================= */
const springs = [];
let rafId = null;
function stepSprings(now){
  springs.forEach(s=>{
    const dt = Math.min((now - s._t) / 1000, 0.032);
    s._t = now;
    const w = 2*Math.PI / s.response;
    const stiffness = w*w, damp = 2*s.damping*w;
    const accel = -stiffness*(s.pos - s.target) - damp*s.vel;
    s.vel += accel*dt;
    s.pos += s.vel*dt;
    s.onUpdate(s.pos);
    if(Math.abs(s.pos - s.target) < 0.2 && Math.abs(s.vel) < 2){
      s.pos = s.target; s.onUpdate(s.pos); s.done = true;
      if(s.onComplete) s.onComplete();
    }
  });
  for(let i=springs.length-1;i>=0;i--) if(springs[i].done) springs.splice(i,1);
  if(springs.length) rafId = requestAnimationFrame(stepSprings);
  else rafId = null;
}
function animateSpring({from, to, velocity=0, damping=1, response=0.38, onUpdate, onComplete}){
  const s = { pos:from, target:to, vel:velocity, damping, response, onUpdate, onComplete, _t: performance.now(), done:false };
  springs.push(s);
  if(!rafId) rafId = requestAnimationFrame(stepSprings);
  return s;
}
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(ms=10){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

/* ================= theme (dark is the stock default; light is the alternate) ================= */
const THEME_ICONS = {
  light: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  dark: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z" fill="currentColor"/></svg>',
};
let theme = "dark";
try{ theme = localStorage.getItem("pb_theme") || "dark"; }catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("themeToggle").innerHTML = THEME_ICONS[theme];
}
document.getElementById("themeToggle").addEventListener("click", ()=>{
  theme = theme==="dark" ? "light" : "dark";
  try{ localStorage.setItem("pb_theme", theme); }catch(e){}
  applyTheme();
});
applyTheme();

/* ================= data ================= */
const STATUSES = [
  { key:"slobodna", label:"Slobodna", color:"var(--st-slobodna)" },
  { key:"prijateljica", label:"Prijateljica", color:"var(--st-prijateljica)" },
  { key:"fwb", label:"FWB", color:"var(--st-fwb)" },
  { key:"ons", label:"ONS", color:"var(--st-ons)" },
  { key:"dejtam", label:"Dejtam", color:"var(--st-dejtam)" },
  { key:"girlfriend", label:"Girlfriend", color:"var(--st-girlfriend)" },
];
const GRADIENTS = [
  ["#8e8ea6","#5f5f78"], ["#9a7d8f","#5c4a5c"], ["#7d8f9a","#4a5c66"],
  ["#998a74","#5c5146"], ["#7d9a8a","#4a665c"], ["#8f7d9a","#5c4a66"],
];

let profiles = [];
function fmtDate(iso){
  try{ return new Date(iso).toLocaleDateString("hr-HR",{day:"numeric",month:"short",year:"numeric"}); }
  catch(e){ return iso; }
}

let filters = { statuses: new Set(), minRating:0, ageMin:null, ageMax:null, location:"", showEnded:true, sort:"rating" };
let searchText = "";
let editingId = null;

function statusInfo(key){ return STATUSES.find(s=>s.key===key) || STATUSES[0]; }
function gradientFor(name){ let h=0; for(const c of name) h=(h*31+c.charCodeAt(0))%GRADIENTS.length; return GRADIENTS[h]; }
function initials(name){ return name.split(" ").filter(Boolean).slice(0,2).map(p=>p[0]).join("").toUpperCase(); }

/* ================= sheet open/close (spring driven) ================= */
function openSheet(sheetEl, backdropEl, onAfterOpen){
  document.getElementById("appRoot").classList.add("receded");
  backdropEl.classList.add("show");
  backdropEl.style.transition = reducedMotion ? "opacity .15s ease" : "opacity .3s ease";
  backdropEl.style.opacity = "1";
  const vh = window.innerHeight;
  const startPct = sheetEl._dragY !== undefined ? sheetEl._dragY : vh;
  if(reducedMotion){ sheetEl.style.transform = "translateY(0)"; if(onAfterOpen) onAfterOpen(); return; }
  animateSpring({ from:startPct, to:0, damping:1, response:0.42,
    onUpdate:(v)=>{ sheetEl.style.transform = `translateY(${v}px)`; },
    onComplete:()=>{ sheetEl._dragY = 0; if(onAfterOpen) onAfterOpen(); }
  });
}
function closeSheet(sheetEl, backdropEl, velocity=0){
  document.getElementById("appRoot").classList.remove("receded");
  backdropEl.style.transition = "opacity .25s ease";
  backdropEl.style.opacity = "0";
  setTimeout(()=>backdropEl.classList.remove("show"), 250);
  const vh = window.innerHeight;
  const current = sheetEl._dragY !== undefined ? sheetEl._dragY : 0;
  if(reducedMotion){ sheetEl.style.transform = `translateY(100%)`; sheetEl._dragY = vh; return; }
  animateSpring({ from:current, to:vh, velocity, damping:1, response:0.36,
    onUpdate:(v)=>{ sheetEl.style.transform = `translateY(${v}px)`; },
    onComplete:()=>{ sheetEl._dragY = vh; }
  });
}
function makeDraggable(sheetEl, backdropEl, handleEl){
  let dragging=false, startY=0, startTranslate=0, lastY=0, lastT=0, vel=0;
  handleEl.addEventListener("pointerdown", (e)=>{
    dragging = true; handleEl.setPointerCapture(e.pointerId);
    startY = e.clientY; startTranslate = sheetEl._dragY || 0; lastY=e.clientY; lastT=performance.now(); vel=0;
  });
  handleEl.addEventListener("pointermove", (e)=>{
    if(!dragging) return;
    let dy = e.clientY - startY + startTranslate;
    if(dy < 0) dy = dy * 0.25; // rubber-band past fully open
    sheetEl.style.transform = `translateY(${dy}px)`;
    sheetEl._dragY = dy;
    const now = performance.now();
    const dt = Math.max(now-lastT, 1);
    vel = (e.clientY - lastY) / (dt/1000);
    lastY = e.clientY; lastT = now;
  });
  handleEl.addEventListener("pointerup", ()=>{
    if(!dragging) return;
    dragging=false;
    const vh = window.innerHeight;
    const shouldClose = sheetEl._dragY > vh*0.28 || vel > 650;
    if(shouldClose) closeSheet(sheetEl, backdropEl, Math.max(vel,0));
    else animateSpring({ from:sheetEl._dragY, to:0, velocity:vel, damping:1, response:0.38,
      onUpdate:(v)=>{ sheetEl.style.transform=`translateY(${v}px)`; },
      onComplete:()=>{ sheetEl._dragY = 0; }
    });
  });
}
[["detailSheet","detailBackdrop","detailHandle"]].forEach(([s,b,h])=>makeDraggable(document.getElementById(s),document.getElementById(b),document.getElementById(h)));
document.querySelectorAll(".sheet-backdrop").forEach(bd=>{
  bd.addEventListener("click",(e)=>{
    if(e.target!==bd) return;
    const sheet = bd.nextElementSibling;
    closeSheet(sheet, bd);
  });
});

/* ================= render grid ================= */
function applyFiltersToList(list){
  return list.filter(p=>{
    if(!filters.showEnded && p.ended) return false;
    if(filters.statuses.size && !filters.statuses.has(p.status)) return false;
    if(p.rating < filters.minRating) return false;
    if(filters.ageMin!=null && p.age < filters.ageMin) return false;
    if(filters.ageMax!=null && p.age > filters.ageMax) return false;
    if(filters.location && p.location !== filters.location) return false;
    if(searchText && !p.name.toLowerCase().includes(searchText.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>{
    if(filters.sort==="rating") return b.rating - a.rating;
    if(filters.sort==="name") return a.name.localeCompare(b.name);
    if(filters.sort==="age") return a.age - b.age;
    return 0;
  });
}
function render(){
  const shown = applyFiltersToList(profiles);
  document.getElementById("countLine").textContent = `${profiles.length} profila u bazi · ${shown.length} prikazano`;
  const grid = document.getElementById("grid");
  if(profiles.length === 0){
    grid.innerHTML = `<div class="empty-state">Još nema dodanih profila.<br>Dodirni "Dodaj" da napraviš prvi.</div>`;
    updateFilterDot();
    return;
  }
  grid.innerHTML = shown.map(p=>{
    const st = statusInfo(p.status);
    const [g1,g2] = gradientFor(p.name);
    const photoStyle = p.photo
      ? `background-image:url('${p.photo}');background-size:cover;background-position:center;`
      : `background:linear-gradient(150deg, ${g1}, ${g2});`;
    return `
    <div class="card pressable ${p.ended?'ended':''}" data-id="${p.id}">
      <div class="photo" style="${photoStyle}">
        ${p.photo ? '' : initials(p.name)}
        <div class="rating-pill">★ ${p.rating.toFixed(1)}</div>
        <div class="status-tag"><span class="dot" style="background:${p.ended?'var(--st-gotovo)':st.color}"></span>${p.ended?'Gotovo':st.label}</div>
      </div>
      <div class="meta">
        <div class="name-line"><span class="name">${p.name}</span><span class="age">${p.age}</span></div>
        <div class="loc">${p.location}</div>
      </div>
    </div>`;
  }).join("") || `<div class="empty-state">Nema profila za ove filtere.</div>`;

  grid.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click", ()=> openDetail(Number(el.dataset.id)));
  });
  updateFilterDot();
}

/* ================= detail sheet ================= */
function openDetail(id){
  const p = profiles.find(x=>x.id===id);
  if(!p) return;
  editingId = id;
  const st = statusInfo(p.status);
  const [g1,g2] = gradientFor(p.name);
  const dAvatar = document.getElementById("dAvatar");
  if(p.photo){
    dAvatar.style.background = `center/cover no-repeat url('${p.photo}')`;
    dAvatar.textContent = "";
  } else {
    dAvatar.style.background = `linear-gradient(150deg, ${g1}, ${g2})`;
    dAvatar.textContent = initials(p.name);
  }
  document.getElementById("dName").textContent = `${p.name}, ${p.age}`;
  document.getElementById("dSub").innerHTML = `<span class="dot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${p.ended?'var(--st-gotovo)':st.color};margin-right:6px;"></span>${p.ended?'Gotovo':st.label}`;
  document.getElementById("dIg").textContent = p.ig || "—";
  document.getElementById("dPhone").textContent = p.phone || "—";
  document.getElementById("dLoc").textContent = p.location || "—";
  document.getElementById("dMet").textContent = p.met || "—";
  const notesBlock = document.getElementById("dNotesBlock");
  if(p.notes){ notesBlock.style.display=""; document.getElementById("dNotes").textContent = p.notes; }
  else notesBlock.style.display = "none";
  document.getElementById("dEndBtn").style.display = p.ended ? "none" : "";
  document.getElementById("dRestoreBtn").style.display = p.ended ? "" : "none";
  document.getElementById("dCreated").textContent = p.createdAt ? `Profil dodan ${fmtDate(p.createdAt)}` : "";
  openSheet(document.getElementById("detailSheet"), document.getElementById("detailBackdrop"));
}
document.getElementById("dEndBtn").addEventListener("click", async ()=>{
  profiles = profiles.map(p=>p.id===editingId?{...p,ended:true}:p);
  await dbPut(profiles.find(p=>p.id===editingId));
  buzz(12);
  closeSheet(document.getElementById("detailSheet"), document.getElementById("detailBackdrop"));
  render();
});
document.getElementById("dRestoreBtn").addEventListener("click", async ()=>{
  profiles = profiles.map(p=>p.id===editingId?{...p,ended:false}:p);
  await dbPut(profiles.find(p=>p.id===editingId));
  buzz(12);
  closeSheet(document.getElementById("detailSheet"), document.getElementById("detailBackdrop"));
  render();
});
document.getElementById("dEditBtn").addEventListener("click", ()=>{
  closeSheet(document.getElementById("detailSheet"), document.getElementById("detailBackdrop"));

});

/* ================= photo picker ================= */
let formPhotoData = null;
const photoInput = document.getElementById("f_photo_input");

/* ================= photo crop (drag to position, slider to zoom) ================= */
const cropFrameEl = document.getElementById("cropFrame");
const cropImageEl = document.getElementById("cropImage");
const cropZoomEl = document.getElementById("cropZoom");
let cropState = null;

function openCropSheet(){
  const sheetEl = document.getElementById("cropSheet");
  const backdropEl = document.getElementById("cropBackdrop");
  backdropEl.classList.add("show");
  backdropEl.style.transition = reducedMotion ? "opacity .15s ease" : "opacity .3s ease";
  backdropEl.style.opacity = "1";
  const vh = window.innerHeight;
  if(reducedMotion){ sheetEl.style.transform = "translateY(0)"; return; }
  animateSpring({ from:vh, to:0, damping:1, response:0.42,
    onUpdate:(v)=>{ sheetEl.style.transform = `translateY(${v}px)`; },
    onComplete:()=>{ sheetEl._dragY = 0; }
  });
}
function closeCropSheet(){
  const sheetEl = document.getElementById("cropSheet");
  const backdropEl = document.getElementById("cropBackdrop");
  backdropEl.style.transition = "opacity .25s ease";
  backdropEl.style.opacity = "0";
  setTimeout(()=>backdropEl.classList.remove("show"), 250);
  const vh = window.innerHeight;
  if(reducedMotion){ sheetEl.style.transform = "translateY(100%)"; return; }
  animateSpring({ from:0, to:vh, damping:1, response:0.36,
    onUpdate:(v)=>{ sheetEl.style.transform = `translateY(${v}px)`; }
  });
}
function clampCropOffset(){
  const { dispW, dispH, frameSize } = cropState;
  const minX = Math.min(0, frameSize - dispW), maxX = 0;
  const minY = Math.min(0, frameSize - dispH), maxY = 0;
  cropState.offsetX = Math.max(minX, Math.min(maxX, cropState.offsetX));
  cropState.offsetY = Math.max(minY, Math.min(maxY, cropState.offsetY));
}
function renderCrop(){
  cropImageEl.style.width = cropState.dispW + "px";
  cropImageEl.style.height = cropState.dispH + "px";
  cropImageEl.style.transform = `translate(${cropState.offsetX}px, ${cropState.offsetY}px)`;
}
function updateCropScale(){
  const zoom = Number(cropZoomEl.value) / 100;
  cropState.scale = cropState.baseScale * zoom;
  cropState.dispW = cropState.iw * cropState.scale;
  cropState.dispH = cropState.ih * cropState.scale;
  clampCropOffset();
  renderCrop();
}
function startCrop(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const frameSize = cropFrameEl.clientWidth || 300;
      const baseScale = Math.max(frameSize / img.naturalWidth, frameSize / img.naturalHeight);
      cropState = {
        src: reader.result,
        iw: img.naturalWidth, ih: img.naturalHeight,
        frameSize, baseScale, scale: baseScale,
        dispW: img.naturalWidth * baseScale, dispH: img.naturalHeight * baseScale,
        offsetX: 0, offsetY: 0,
      };
      cropState.offsetX = (frameSize - cropState.dispW) / 2;
      cropState.offsetY = (frameSize - cropState.dispH) / 2;
      cropImageEl.style.backgroundImage = `url('${reader.result}')`;
      cropImageEl.style.backgroundSize = "100% 100%";
      cropZoomEl.value = 100;
      renderCrop();
      openCropSheet();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}
let cropDragging = false, cropStartX = 0, cropStartY = 0, cropStartOffX = 0, cropStartOffY = 0;
cropFrameEl.addEventListener("pointerdown", (e)=>{
  if(!cropState) return;
  cropDragging = true;
  cropFrameEl.setPointerCapture(e.pointerId);
  cropStartX = e.clientX; cropStartY = e.clientY;
  cropStartOffX = cropState.offsetX; cropStartOffY = cropState.offsetY;
});
cropFrameEl.addEventListener("pointermove", (e)=>{
  if(!cropDragging || !cropState) return;
  cropState.offsetX = cropStartOffX + (e.clientX - cropStartX);
  cropState.offsetY = cropStartOffY + (e.clientY - cropStartY);
  clampCropOffset();
  renderCrop();
});
["pointerup","pointercancel"].forEach(ev=> cropFrameEl.addEventListener(ev, ()=>{ cropDragging = false; }));
cropZoomEl.addEventListener("input", updateCropScale);
document.getElementById("cropCancel").addEventListener("click", ()=>{
  cropState = null;
  photoInput.value = "";
  closeCropSheet();
});
document.getElementById("cropSave").addEventListener("click", ()=>{
  if(!cropState) return;
  const OUT = 480;
  const canvas = document.createElement("canvas");
  canvas.width = OUT; canvas.height = OUT;
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.onload = ()=>{
    const scale = cropState.scale;
    const sx = -cropState.offsetX / scale;
    const sy = -cropState.offsetY / scale;
    const sSize = cropState.frameSize / scale;
    ctx.drawImage(img, sx, sy, sSize, sSize, 0, 0, OUT, OUT);
    formPhotoData = canvas.toDataURL("image/jpeg", 0.88);
    updatePhotoPreview();
    cropState = null;
    closeCropSheet();
  };
  img.src = cropState.src;
});

/* ================= lock screen (biometric gate, falls back to a local PIN) ================= */
function b64urlToBuffer(b64url){
  const b64 = b64url.replace(/-/g,'+').replace(/_/g,'/');
  const pad = b64.length % 4 ? '='.repeat(4 - (b64.length % 4)) : '';
  const str = atob(b64 + pad);
  const bytes = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) bytes[i] = str.charCodeAt(i);
  return bytes.buffer;
}
function bufferToB64url(buf){
  const bytes = new Uint8Array(buf);
  let str = '';
  for(const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function randomBytes(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function biometricAvailable(){
  try{
    return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
  }catch(e){ return false; }
}
async function registerBiometric(){
  const cred = await navigator.credentials.create({ publicKey: {
    challenge: randomBytes(32),
    rp: { name: "PlayBook" },
    user: { id: randomBytes(16), name: "playbook-local", displayName: "PlayBook" },
    pubKeyCredParams: [{ type:"public-key", alg:-7 }, { type:"public-key", alg:-257 }],
    authenticatorSelection: { authenticatorAttachment:"platform", userVerification:"required" },
    timeout: 60000,
    attestation: "none",
  }});
  localStorage.setItem("pb_cred_id", bufferToB64url(cred.rawId));
}
async function verifyBiometric(){
  const credId = localStorage.getItem("pb_cred_id");
  const options = { challenge: randomBytes(32), timeout: 60000, userVerification: "required" };
  if(credId) options.allowCredentials = [{ id: b64urlToBuffer(credId), type:"public-key" }];
  const assertion = await navigator.credentials.get({ publicKey: options });
  return !!assertion;
}

const lockSub = document.getElementById("lockSub");
const fpBtn = document.getElementById("fpBtn");
const pinWrap = document.getElementById("pinWrap");
const pinInput = document.getElementById("pinInput");
const pinSubmit = document.getElementById("pinSubmit");
const lockError = document.getElementById("lockError");

function setLockError(msg){ lockError.textContent = msg || ""; }

async function proceedAfterUnlock(){
  document.getElementById("lockScreen").style.display = "none";
  const splash = document.getElementById("splashScreen");
  splash.classList.add("show");
  setTimeout(()=>{
    splash.classList.add("out");
    setTimeout(()=>{
      splash.style.display = "none";
      document.getElementById("appRoot").style.display = "block";
    }, 500);
  }, 2900);
}

async function tryBiometric(){
  setLockError("");
  try{
    const hasCred = !!localStorage.getItem("pb_cred_id");
    if(!hasCred){
      lockSub.textContent = "Skenirajte otisak prsta za postavljanje";
      await registerBiometric();
    } else {
      await verifyBiometric();
    }
    buzz(15);
    proceedAfterUnlock();
  }catch(e){
    setLockError("Otisak nije prepoznat. Pokušaj ponovno.");
  }
}
fpBtn.addEventListener("click", tryBiometric);

async function tryPin(){
  setLockError("");
  const val = pinInput.value.trim();
  if(val.length < 4){ setLockError("PIN mora imati bar 4 znamenke."); return; }
  const storedHash = localStorage.getItem("pb_pin_hash");
  if(!storedHash){
    const hash = await sha256Hex(val);
    localStorage.setItem("pb_pin_hash", hash);
    buzz(15);
    proceedAfterUnlock();
    return;
  }
  const hash = await sha256Hex(val);
  if(hash === storedHash){
    buzz(15);
    proceedAfterUnlock();
  } else {
    setLockError("Pogrešan PIN.");
    pinInput.value = "";
  }
}
pinSubmit.addEventListener("click", tryPin);
pinInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") tryPin(); });

async function initLock(){
  const hasCred = !!localStorage.getItem("pb_cred_id");
  const hasPin = !!localStorage.getItem("pb_pin_hash");
  const available = await biometricAvailable();
  fpBtn.hidden = true;
  pinWrap.hidden = true;
  if(available){
    fpBtn.hidden = false;
    lockSub.textContent = hasCred ? "Skenirajte otisak prsta za potvrdu identiteta" : "Skenirajte otisak prsta za postavljanje";
  } else {
    pinWrap.hidden = false;
    lockSub.textContent = hasPin ? "Unesi PIN" : "Postavi lokalni PIN";
    pinInput.value = "";
    pinInput.focus();
  }
}

/* ================= boot ================= */
(async function boot(){
  try{ profiles = await dbGetAll(); }catch(e){ profiles = []; }
  render();
  initLock();
})();
